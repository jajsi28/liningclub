<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login - Lining Club</title>
    <link rel="stylesheet" href="styles.css"/>
    <link rel="stylesheet" href="auth.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Helvetica+Neue:wght@300;400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <form class="auth-form" id="loginForm">
            <h2>Нэвтрэх</h2>
            <div class="form-group">
                <label for="login-email">Email</label>
                <input type="email" id="login-email" name="email" required autocomplete="username" />
            </div>
            <div class="form-group">
                <label for="login-password">Нууц үг</label>
                <input type="password" id="login-password" name="password" required autocomplete="current-password" />
            </div>
            <button type="submit" class="btn-auth">Нэвтрэх</button>
            <div class="auth-extra">
                <a href="signup.html">Бүртгүүлэх</a>
                <a href="#" class="forgot-password">Нууц үгээ мартсан?</a>
            </div>
        </form>
    </div>

    <script>
        // Demo login: accepts any non-empty credentials and redirects to homepage
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const pass = document.getElementById('login-password').value.trim();
            if (!email || !pass) {
                alert('Бүх талбарыг бөглөнө үү');
                return;
            }
            alert('Амжилттай нэвтэрлээ (Тест)!');
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
