<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product – Lining Club</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <a href="./index.html" style="display:flex; align-items:center; gap:10px; text-decoration:none;">
                <img src="./logo.png" alt="Lining Club" class="logo" style="height:34px;width:auto;">
                <strong style="color:#000; font-size:18px; letter-spacing:0.5px;">Lining Club</strong>
            </a>
            <nav style="position:relative;">
                <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
                <ul class="nav-menu" id="navMenu">
                    <li><a class="nav-link" href="./products.html">Shop</a></li>
                    <li><a class="nav-link" href="./cart.html">Cart</a></li>
                    <li><a class="nav-link" href="./profile.html">Profile</a></li>
                    <li><a class="nav-link" href="./login.html">Sign in</a></li>
                    <li><a class="nav-link" href="./signup.html">Sign up</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container" style="padding-top:100px; padding-bottom:60px;">
        <nav style="font-size:14px; color:#666; margin-bottom:14px;">
            <a href="./index.html" class="nav-link">Home</a> / <a href="./products.html" class="nav-link">Shop</a>
        </nav>
        <div id="productContainer"></div>
    </main>

    <footer class="footer">
        <div class="footer-bottom">© 2025 Lining Club</div>
    </footer>

    <script>
        const hamburger = document.getElementById('hamburger');
        const navMenu = document.getElementById('navMenu');
        hamburger.addEventListener('click', () => navMenu.classList.toggle('show'));

        const params = new URLSearchParams(location.search);
        const productId = params.get('id');

        function getCart(){
            try { return JSON.parse(localStorage.getItem('cart')||'[]'); } catch(e){ return []; }
        }
        function saveCart(cart){ localStorage.setItem('cart', JSON.stringify(cart)); }

        async function loadProduct(){
            const res = await fetch('./products.json');
            const items = await res.json();
            const p = items.find(x => String(x.id) === String(productId));
            const container = document.getElementById('productContainer');
            if(!p){ container.innerHTML = '<p>Product not found.</p>'; return; }
            container.innerHTML = `
                <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap:2rem; align-items:start;">
                    <div>
                        <img class="product-image" style="height:420px; object-fit:cover; border-radius:12px;" src="${p.image}" alt="${p.name}">
                    </div>
                    <div>
                        <h1 class="section-title" style="text-align:left; margin-bottom:1rem;">${p.name}</h1>
                        <div style="display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap;">
                            ${(p.tags||[]).map(t => `<span class=\"badge ${t}\">${t}</span>`).join('')}
                        </div>
                        <div class="product-price" style="margin:0 0 1rem 0;">$${p.price}</div>
                        <p style="color:#555; margin-bottom:1rem;">${p.description || 'Comfortable everyday shoe with breathable materials.'}</p>
                        <button class="btn-primary" id="addToCart">Add to Cart</button>
                    </div>
                </div>`;
            document.getElementById('addToCart').addEventListener('click', ()=>{
                const cart = getCart();
                const existing = cart.find(ci => ci.id===p.id);
                if(existing) existing.qty += 1; else cart.push({id:p.id, name:p.name, price:p.price, image:p.image, qty:1});
                saveCart(cart);
                alert('Added to cart');
            });
        }
        loadProduct();
    </script>
</body>
</html>
